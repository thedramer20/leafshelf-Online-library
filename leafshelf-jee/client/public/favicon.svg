<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F5EDD8" />
      <stop offset="100%" stop-color="#E8D9BE" />
    </linearGradient>
    <linearGradient id="fav-ll" x1="0.8" y1="1" x2="0.1" y2="0">
      <stop offset="0%"   stop-color="#071410" />
      <stop offset="45%"  stop-color="#1B4332" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
    <linearGradient id="fav-rl" x1="0.2" y1="1" x2="0.9" y2="0">
      <stop offset="0%"   stop-color="#163829" />
      <stop offset="50%"  stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <linearGradient id="fav-ls" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#74C69D" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#74C69D" stop-opacity="0"    />
    </linearGradient>
    <linearGradient id="fav-rs" x1="1" y1="0" x2="0.2" y2="1">
      <stop offset="0%"   stop-color="#95D5B2" stop-opacity="0.5"  />
      <stop offset="100%" stop-color="#95D5B2" stop-opacity="0"    />
    </linearGradient>
  </defs>

  <!-- Warm beige rounded-square background (looks like app icon) -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#fav-bg)" />

  <!-- Left leaf -->
  <path d="M 42 66  C 10 62  0 32  20 16  C 30 8  42 24  42 66  Z" fill="url(#fav-ll)" />
  <path d="M 40 62  C 16 56  4 34  22 18  C 28 12  38 22  40 62  Z" fill="url(#fav-ls)" />
  <path d="M 42 64  Q 28 40  22 18"
    stroke="rgba(255,255,255,0.26)" stroke-width="1.4" stroke-linecap="round" fill="none" />
  <path d="M 34 54 L 10 46   M 29 43 L 6 37   M 25 33 L 12 28"
    stroke="rgba(255,255,255,0.18)" stroke-width="1.0" stroke-linecap="round" fill="none" />

  <!-- Right leaf -->
  <path d="M 58 64  C 90 60  100 30  80 14  C 70 6  58 22  58 64  Z" fill="url(#fav-rl)" />
  <path d="M 60 60  C 84 54  96 28  78 14  C 70 6  60 20  60 60  Z" fill="url(#fav-rs)" />
  <path d="M 58 62  Q 72 38  78 16"
    stroke="rgba(255,255,255,0.26)" stroke-width="1.4" stroke-linecap="round" fill="none" />
  <path d="M 66 52 L 90 44   M 71 41 L 94 35   M 75 31 L 88 26"
    stroke="rgba(255,255,255,0.18)" stroke-width="1.0" stroke-linecap="round" fill="none" />

  <!-- Forked stem -->
  <path d="M 50 96  C 50 84  45 76  42 66"
    stroke="#071410" stroke-width="3.8" stroke-linecap="round" fill="none" />
  <path d="M 50 96  C 50 84  55 76  58 64"
    stroke="#0d1f15" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <circle cx="50" cy="90" r="2.8" fill="#0d1f15" />
</svg>
