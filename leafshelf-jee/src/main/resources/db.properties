# LeafShelf — Database configuration
#
# DEFAULT: MySQL on localhost. Run schema.sql first (mysql -u root -p < schema.sql),
# then edit username/password below.
#
# ALTERNATIVE: H2 (embedded, zero-setup). Comment out the MySQL block and
# uncomment the H2 block. The app will create everything automatically.

# ====== MySQL (default) ======
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/leafshelf?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
# db.username=root
# db.password=

# ====== H2 embedded (uncomment to use instead) ======
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./leafshelf-data/leafshelf;MODE=MySQL;DATABASE_TO_UPPER=FALSE;AUTO_SERVER=TRUE
db.username=sa
db.password=

# Pool tuning
db.pool.maxSize=10
db.pool.minIdle=2
